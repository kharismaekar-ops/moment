<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhani & Fitrah</title>

<!-- Open Graph Preview -->
<meta name="description" content="Abadikan momen pernikahan Dhani & Fitrah dari sudut pandangmu.">
<meta property="og:type" content="website">
<meta property="og:title" content="Dhani & Fitrah">
<meta property="og:description" content="Scan QR atau buka kamera untuk mengabadikan momen spesial Dhani & Fitrah secara langsung ke album bersama.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root {
    --bg: #F6F5EF;
    --card: #FFFFFF;
    --ink: #4A4A38;
    --mut: #75755E;
    --acc: #636342;
    --soft: #9CA383;
    --leaf: #566B44;
    --gold: #8F8956;
    --blush: #DDA3A5;
    --line: #E6E4DA;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 50% 25%, #FCFBF8 0%, #F6F5EF 78%);
    color: var(--ink);
    font-family: 'Noto Serif', Georgia, serif;
    line-height: 1.65;
    min-height: 100svh;
    padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }
  /* Tekstur kertas cat air halus */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='paper'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='matrix' values='1 0 0 0 0.94 0 1 0 0 0.93 0 0 1 0 0.89 0 0 0 0.22 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23paper)'/%3E%3C/svg%3E");
  }

  /* Kelopak melayang halus */
  .petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .petal { position: absolute; top: -10%; opacity: 0; animation: floatPetal linear infinite; }
  .petal.blush { width: 10px; height: 7px; background: radial-gradient(circle at 30% 30%, #F5D5D6, #DF9FA2); border-radius: 75% 15% 75% 15%; }
  .petal.white { width: 9px; height: 6px; background: radial-gradient(circle at 30% 30%, #FFFFFF, #EAE7DC); border-radius: 80% 10% 80% 10%; }
  @keyframes floatPetal {
    0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    15% { opacity: 0.65; }
    50% { transform: translate3d(var(--sway, 20px), 48vh, 0) rotate(160deg); }
    85% { opacity: 0.55; }
    100% { transform: translate3d(calc(var(--sway, 20px) * -0.6), 102vh, 0) rotate(320deg); opacity: 0; }
  }

  .wrap { position: relative; z-index: 2; max-width: 520px; margin: 0 auto; padding: 24px 18px; }
  .script { font-family: 'Alex Brush', cursive; font-weight: 400; line-height: 1.15; }
  .serif-title { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; }

  /* Header Monogram */
  header { text-align: center; padding: 8px 0 18px; }
  .monogram { width: 78px; margin: 0 auto 4px; }
  .monogram svg { width: 100%; height: auto; display: block; }
  header h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.45rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #5B5B3B;
    margin: 0;
  }
  header p { font-size: .8rem; color: var(--mut); margin: 4px 0 0; }

  body.cam-mode header { display: none; }

  /* Status pill */
  .status-bar {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .74rem; color: var(--acc);
    background: rgba(255,255,255,0.85);
    border: 1px solid #DFDCD0;
    padding: 4px 12px; border-radius: 999px;
    margin-top: 8px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #9CA383; }
  .dot.live { background: #566B44; box-shadow: 0 0 0 3px rgba(86,107,68,0.18); }

  /* Kartu Double-Border khas Undangan */
  .card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, #FFFFFF 0%, #FAF9F4 100%);
    border: 1.5px solid #D5D2C2;
    border-radius: 24px;
    padding: 30px 22px 26px;
    box-shadow: 0 10px 30px rgba(99, 99, 66, 0.06);
    text-align: center;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid #E4E1D3;
    border-radius: 17px;
    pointer-events: none;
  }
  .card > * { position: relative; z-index: 1; }
  .sprig { position: absolute; width: 96px; height: 96px; pointer-events: none; opacity: 0.72; z-index: 0; }
  .sprig.tl { top: -4px; left: -4px; }
  .sprig.br { bottom: -4px; right: -4px; transform: rotate(180deg); }

  /* Tombol */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--acc);
    color: var(--ink);
    background: transparent;
    padding: 11px 22px;
    border-radius: 999px;
    font: 500 .88rem 'Noto Serif', serif;
    cursor: pointer;
    text-decoration: none;
    transition: background .2s, color .2s, transform .12s;
  }
  .btn:active { transform: scale(0.98); }
  .btn.fill { background: var(--acc); color: #fff; }
  .btn.fill:hover { background: #4E4E34; }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  /* Tab Panels */
  .panel { display: none; animation: fadeIn .35s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* QR Box */
  .qr-frame {
    display: inline-block;
    padding: 16px;
    background: #FFFFFF;
    border: 1.5px solid #C8C4B0;
    border-radius: 18px;
    margin: 14px auto;
    box-shadow: 0 6px 18px rgba(99,99,66,0.06);
  }
  #qrcode img, #qrcode canvas { display: block; margin: 0 auto; border-radius: 6px; }

  /* Kamera */
  .cam-shell {
    position: relative;
    width: min(100%, max(220px, calc((100svh - 410px) * 0.75)));
    aspect-ratio: 3 / 4;
    margin-left: auto; margin-right: auto;
    background: #23231B;
    border-radius: 18px;
    overflow: hidden;
    border: 1.5px solid #C8C4B0;
    margin: 10px auto 14px;
  }
  #video, #previewCanvas {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  #previewCanvas { display: none; }
  .cam-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; color: #EAE8DF; text-align: center;
    background: linear-gradient(160deg, #3A3A2B 0%, #26261C 100%);
  }

  /* Filter Pills */
  .filters {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    padding: 4px 2px 10px;
  }
  .flt {
    padding: 7px 6px; border-radius: 999px; text-align: center; white-space: nowrap;
    border: 1px solid #D5D2C2; background: #FAF9F5;
    color: var(--ink); font: 500 .78rem 'Noto Serif', serif;
    cursor: pointer; transition: all .2s;
  }
  .flt.on { background: var(--acc); color: #fff; border-color: var(--acc); }

  .cam-controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 6px; }
  .shutter {
    width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid var(--acc); background: #FFFFFF;
    padding: 4px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(99,99,66,0.2);
  }
  .shutter span {
    display: block; width: 100%; height: 100%;
    border-radius: 50%; background: var(--acc);
    transition: transform .1s;
  }
  .shutter:active span { transform: scale(0.88); }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid #D5D2C2; background: #FAF9F5;
    color: var(--ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Form Upload setelah Jepret */
  .post-shot { text-align: left; margin-top: 12px; }
  .post-shot label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 4px; color: var(--acc); }
  .post-shot input {
    width: 100%; padding: 10px 13px; margin-bottom: 10px;
    border: 1px solid #D5D2C2; border-radius: 12px;
    background: #FFFFFF; color: var(--ink);
    font: 400 .9rem 'Noto Serif', serif;
  }

  /* Galeri Album Polaroid */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 14px;
  }
  .polaroid {
    background: #FFFFFF;
    border: 1px solid #DFDCD0;
    border-radius: 14px;
    padding: 8px 8px 12px;
    box-shadow: 0 6px 16px rgba(99,99,66,0.06);
    text-align: left;
    position: relative;
  }
  .polaroid img {
    width: 100%; aspect-ratio: 3 / 4; object-fit: cover;
    border-radius: 9px; display: block; background: #EFECE3;
  }
  .polaroid .cap { margin-top: 8px; font-size: .8rem; font-weight: 600; color: var(--acc); line-height: 1.3; }
  .polaroid .msg { font-size: .74rem; color: var(--mut); margin-top: 2px; line-height: 1.35; }
  .polaroid .act { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #E6E4DA; }
  .mini-link { font-size: .72rem; color: var(--acc); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; font-family: inherit; }

  /* Navigasi Bawah Melayang */
  nav.bottom-nav {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(8px);
    border: 1px solid #D5D2C2;
    border-radius: 999px;
    padding: 5px;
    box-shadow: 0 8px 24px rgba(74, 74, 56, 0.14);
  }
  nav.bottom-nav button {
    border: none; background: transparent;
    padding: 9px 15px; border-radius: 999px;
    color: var(--ink); font: 500 .82rem 'Noto Serif', serif;
    cursor: pointer; transition: background .2s, color .2s;
    white-space: nowrap;
  }
  nav.bottom-nav button.active { background: var(--acc); color: #FFFFFF; }

  .flash-fx {
    position: fixed; inset: 0; background: #FFFDF7;
    opacity: 0; pointer-events: none; z-index: 99;
    transition: opacity .35s ease-out;
  }
  .flash-fx.bang { opacity: 0.92; transition: none; }
</style>
</head>
<body>

<div class="flash-fx" id="flashFx"></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1>DHANI &amp; FITRAH</h1>
    <p>10.01.2027</p>
    <div class="status-bar">
      <span class="dot" id="connDot"></span>
      <span id="connText">Menghubungkan album...</span>
    </div>
  </header>

  <!-- PANEL 1: MEJA QR -->
  <section id="panel-qr" class="panel active">
    <div class="card">
      <svg class="sprig tl" viewBox="0 0 120 120" fill="none"><path d="M-4 68 C22 52, 46 34, 74 4" stroke="#7D8C57" stroke-width="1.2"/><ellipse cx="44" cy="30" rx="4" ry="9" transform="rotate(-35 44 30)" fill="#9CA876" opacity="0.7"/><ellipse cx="26" cy="46" rx="4" ry="9" transform="rotate(-55 26 46)" fill="#8A995C" opacity="0.65"/><circle cx="60" cy="16" r="3.5" fill="#E6C345" opacity="0.85"/></svg>
      <svg class="sprig br" viewBox="0 0 120 120" fill="none"><path d="M-4 68 C22 52, 46 34, 74 4" stroke="#7D8C57" stroke-width="1.2"/><ellipse cx="44" cy="30" rx="4" ry="9" transform="rotate(-35 44 30)" fill="#9CA876" opacity="0.7"/><ellipse cx="26" cy="46" rx="4" ry="9" transform="rotate(-55 26 46)" fill="#8A995C" opacity="0.65"/><circle cx="60" cy="16" r="3.5" fill="#E6C345" opacity="0.85"/></svg>

      <h2 class="script" style="font-size:2.3rem;color:var(--acc);margin:4px 0 6px">Abadikan Momen Kami</h2>
      <p style="font-size:.86rem;color:var(--mut);margin:0 0 8px">Scan QR Code di bawah menggunakan kamera HP untuk memotret dan menyimpannya ke album pernikahan kami.</p>

      <div class="qr-frame">
        <div id="qrcode"></div>
      </div>

      <div style="height:12px"></div>

      <div style="display:flex;flex-direction:column;gap:8px;max-width:270px;margin:0 auto">
        <button class="btn fill" onclick="switchTab('camera')">Buka Kamera</button>
        <button class="btn" id="copyLinkBtn" style="font-size:.82rem;padding:9px 18px">Salin Link</button>
      </div>
    </div>
  </section>

  <!-- PANEL 2: KAMERA -->
  <section id="panel-camera" class="panel">
    <div class="card" style="padding:20px 16px 22px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:.78rem;color:var(--mut)">Halo, <strong id="guestDisplay" style="color:var(--acc)">Tamu Undangan</strong></span>
        
      </div>

      <div class="cam-shell">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="previewCanvas"></canvas>

        <div class="cam-placeholder" id="camPlaceholder">
          <p style="font-size:.92rem;margin:0 0 12px">Kamera siap digunakan untuk mengabadikan momen.</p>
          <button class="btn fill" id="startCamBtn" style="background:#FAF9F5;color:#4A4A38;border-color:#FAF9F5">Aktifkan Kamera</button>
          <label class="btn" style="margin-top:10px;font-size:.78rem;color:#FAF9F5;border-color:rgba(255,255,255,0.45);cursor:pointer">
            Atau Pilih Foto dari Galeri
            <input type="file" id="fileInput" accept="image/*" hidden>
          </label>
        </div>
      </div>

      <!-- Pilihan Filter -->
      <div class="filters" id="filterBar">
        <button class="flt on" data-filter="warm">Hangat</button>
        <button class="flt" data-filter="flash">Flash</button>
        <button class="flt" data-filter="faded">Pudar</button>
        <button class="flt" data-filter="blue">Biru</button>
        <button class="flt" data-filter="natural">Natural</button>
        <button class="flt" data-filter="mono">Hitam Putih</button>
      </div>

      <!-- Kontrol Jepret -->
      <div class="cam-controls" id="liveControls">
        <label class="icon-btn" title="Pilih dari galeri" style="cursor:pointer">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <input type="file" id="fileInput2" accept="image/*" hidden>
        </label>
        <button class="shutter" id="shutterBtn" aria-label="Ambil Foto"><span></span></button>
        <button class="icon-btn" id="flipCamBtn" title="Ganti Kamera Depan/Belakang">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
        </button>
      </div>

      <!-- Form Simpan Setelah Foto Diambil -->
      <div class="post-shot" id="postShotBox" style="display:none">
        <label for="senderName">Nama Kamu</label>
        <input id="senderName" placeholder="Tulis namamu..." maxlength="36">
        <label for="senderNote">Caption Singkat (Opsional)</label>
        <input id="senderNote" placeholder="Selamat menempuh hidup baru Dhani & Fitrah!" maxlength="90">
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn" id="retakeBtn" style="flex:1">Ulangi</button>
          <button class="btn fill" id="uploadBtn" style="flex:2">Simpan ke Album</button>
        </div>
      </div>
    </div>
  </section>

  <!-- PANEL 3: LIVE ALBUM -->
  <section id="panel-album" class="panel">
    <div class="card" style="padding:24px 16px">
      <h2 class="script" style="font-size:2.2rem;color:var(--acc);margin:0 0 4px">Album Kenangan Tamu</h2>
      <p style="font-size:.82rem;color:var(--mut);margin:0 0 12px" id="photoCountText">Memuat kenangan...</p>
      <div class="gallery-grid" id="galleryGrid"></div>
      <div style="margin-top:16px">
        <button class="btn" id="loadMoreBtn" style="display:none">Muat lebih banyak</button>
      </div>
    </div>
  </section>
</div>

<nav class="bottom-nav" aria-label="Menu Utama">
  <button class="active" data-tab="qr" onclick="switchTab('qr')">Beranda</button>
  <button data-tab="camera" onclick="switchTab('camera')">Kamera</button>
  <button data-tab="album" onclick="switchTab('album')">Album (<span id="navCount">0</span>)</button>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  // Konfigurasi Firebase Proyek moment-ab45b
  const CUSTOM_FIREBASE_CONFIG = {
    apiKey: "AIzaSyBc6L-QNgEp318uFVEr0qYPlpCJF2BjYKQ",
    authDomain: "moment-ab45b.firebaseapp.com",
    projectId: "moment-ab45b",
    storageBucket: "moment-ab45b.firebasestorage.app",
    messagingSenderId: "1012769282213",
    appId: "1:1012769282213:web:c64c7802f15727fb19d54c",
    measurementId: "G-BLBW3DY93T"
  };

  const firebaseConfig = (typeof __firebase_config !== 'undefined')
    ? JSON.parse(__firebase_config)
    : CUSTOM_FIREBASE_CONFIG;

  const appId = (typeof __app_id !== 'undefined') ? __app_id : 'dhani-fitrah-wedding';

  // Inisialisasi Kelopak Bunga Melayang
  (function initPetals() {
    const box = document.getElementById('petals');
    const types = ['blush', 'white'];
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('span');
      p.className = 'petal ' + types[i % 2];
      p.style.left = (5 + ((i * 7.8) % 90)).toFixed(1) + '%';
      p.style.animationDuration = (12 + (i % 6) * 2).toFixed(1) + 's';
      p.style.animationDelay = (-1 * (i * 1.5)).toFixed(1) + 's';
      p.style.setProperty('--sway', ((i % 2 === 0 ? 1 : -1) * 20) + 'px');
      box.appendChild(p);
    }
  })();

  // Parameter URL (?room=... & ?to=... & ?mode=camera)
  const params = new URLSearchParams(location.search);
  const roomCode = (params.get('room') || 'DHANI-FITRAH').toUpperCase().replace(/[^A-Z0-9-_]/g, '').slice(0, 24) || 'DHANI-FITRAH';
  const guestName = (params.get('to') || params.get('kepada') || '').trim().slice(0, 36);

    if (guestName) {
    document.getElementById('guestDisplay').textContent = guestName;
    document.getElementById('senderName').value = guestName;
  }

  // Generate QR Code mengarah langsung ke mode kamera
  const baseUrl = location.origin + location.pathname;
  const shareUrl = `${baseUrl}?room=${encodeURIComponent(roomCode)}&mode=camera`;
  
  new QRCode(document.getElementById('qrcode'), {
    text: shareUrl,
    width: 196,
    height: 196,
    colorDark: "#4A4A38",
    colorLight: "#FFFFFF",
    correctLevel: QRCode.CorrectLevel.M
  });

  document.getElementById('copyLinkBtn').onclick = function() {
    navigator.clipboard?.writeText(shareUrl).then(() => {
      this.textContent = 'Link Tersalin ✓';
      setTimeout(() => { this.textContent = 'Salin Link'; }, 2200);
    });
  };

  // Navigasi Tab
  window.switchTab = function(tab) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    document.body.classList.toggle('cam-mode', tab === 'camera');
    document.querySelector(`.bottom-nav button[data-tab="${tab}"]`).classList.add('active');
    if (tab === 'camera' && !stream && !hasCaptured) startCamera();
  };

  if (params.get('mode') === 'camera') {
    window.switchTab('camera');
  }

  // (tanggal HUD dihapus)

  // Logika Kamera & Filter
  const video = document.getElementById('video');
  const canvas = document.getElementById('previewCanvas');
  const ctx = canvas.getContext('2d');
  let stream = null;
  let facingMode = 'environment';
  let currentFilter = 'warm';
  let hasCaptured = false;
  let capturedDataUrl = '';

  // css = pratinjau live (perkiraan); p = parameter pixel untuk hasil foto (sama di semua browser, termasuk iOS Safari)
  // c kontras, s saturasi, b kecerahan, r/g/bl warna, lift = hitam diangkat (kesan pudar),
  // grain = bintik halus, vig = sudut menggelap, flash = tengah lebih terang (efek lampu flash)
  const FILTERS = {
    warm:    { css: 'contrast(1.08) saturate(1.2) sepia(0.14) brightness(1.04)',
               p: { c: 1.08, s: 1.20, b: 1.04, r: 1.06, g: 1.01, bl: 0.90, lift: 8,  grain: 6,  vig: 0.16, flash: 0 } },
    flash:   { css: 'contrast(1.18) saturate(1.05) brightness(1.08)',
               p: { c: 1.18, s: 1.05, b: 1.06, r: 1.0,  g: 1.0,  bl: 0.97, lift: 6,  grain: 5,  vig: 0.24, flash: 0.20 } },
    faded:   { css: 'contrast(0.95) saturate(0.85) brightness(1.06) hue-rotate(-6deg)',
               p: { c: 0.95, s: 0.85, b: 1.04, r: 0.98, g: 1.03, bl: 1.02, lift: 24, grain: 8,  vig: 0.12, flash: 0 } },
    blue:    { css: 'contrast(1.1) saturate(1.2) hue-rotate(-10deg) brightness(1.04)',
               p: { c: 1.10, s: 1.20, b: 1.04, r: 0.92, g: 1.0,  bl: 1.08, lift: 6,  grain: 5,  vig: 0.16, flash: 0 } },
    natural: { css: 'contrast(1.05) saturate(1.08) brightness(1.02)',
               p: { c: 1.05, s: 1.08, b: 1.02, r: 1.0,  g: 1.0,  bl: 1.0,  lift: 0,  grain: 0,  vig: 0.10, flash: 0 } },
    mono:    { css: 'grayscale(1) contrast(1.2) brightness(1.02)',
               p: { c: 1.20, s: 0,    b: 1.02, r: 1.0,  g: 1.0,  bl: 1.0,  lift: 10, grain: 12, vig: 0.22, flash: 0 } }
  };

  function applyFilterPixels(c2d, w, h, p) {
    const img = c2d.getImageData(0, 0, w, h);
    const d = img.data;
    const scale = (255 - p.lift) / 255;
    const grainAmp = p.grain * 2;
    for (let y = 0; y < h; y++) {
      const dy = (y / h - 0.5) * 2;
      for (let x = 0; x < w; x++) {
        const dx = (x / w - 0.5) * 2;
        const d2 = (dx * dx + dy * dy) / 2;               // 0 di tengah, 1 di sudut
        const light = (1 - p.vig * d2) * (1 + p.flash * Math.max(0, 1 - d2 * 1.6));
        const i = (y * w + x) * 4;
        let r = d[i], g = d[i+1], b = d[i+2];
        const l = 0.299*r + 0.587*g + 0.114*b;
        r = l + (r - l) * p.s; g = l + (g - l) * p.s; b = l + (b - l) * p.s;
        r = ((r - 128) * p.c + 128) * p.b * p.r * light;
        g = ((g - 128) * p.c + 128) * p.b * p.g * light;
        b = ((b - 128) * p.c + 128) * p.b * p.bl * light;
        const n = grainAmp ? (Math.random() - 0.5) * grainAmp : 0;
        r = p.lift + r * scale + n; g = p.lift + g * scale + n; b = p.lift + b * scale + n;
        d[i]   = r < 0 ? 0 : r > 255 ? 255 : r;
        d[i+1] = g < 0 ? 0 : g > 255 ? 255 : g;
        d[i+2] = b < 0 ? 0 : b > 255 ? 255 : b;
      }
    }
    c2d.putImageData(img, 0, 0);
  }

  document.querySelectorAll('.flt').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.flt').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      currentFilter = btn.dataset.filter;
      video.style.filter = FILTERS[currentFilter].css;
    };
  });
  video.style.filter = FILTERS.warm.css;

  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1440 }, frameRate: { ideal: 30 } },
        audio: false
      });
      video.srcObject = stream;
      video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'none';
      document.getElementById('camPlaceholder').style.display = 'none';
    } catch (err) {
      document.getElementById('camPlaceholder').style.display = 'flex';
    }
  }

  document.getElementById('startCamBtn').onclick = startCamera;
  document.getElementById('flipCamBtn').onclick = () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  };

  function playShutterSound() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(880, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, ac.currentTime + 0.09);
      gain.gain.setValueAtTime(0.25, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + 0.09);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(); osc.stop(ac.currentTime + 0.09);
    } catch (e) {}
  }

  function triggerFlash() {
    const fx = document.getElementById('flashFx');
    fx.classList.add('bang');
    requestAnimationFrame(() => setTimeout(() => fx.classList.remove('bang'), 40));
  }

  function renderFrame(sourceEl, isMirrored) {
    const sw = sourceEl.videoWidth || sourceEl.naturalWidth || 1080;
    const sh = sourceEl.videoHeight || sourceEl.naturalHeight || 1440;

    // Rasio 3:4, resolusi mengikuti sumber (maks 1080x1440) supaya tidak pecah
    const targetRatio = 3 / 4;
    const srcRatio = sw / sh;
    let sx = 0, sy = 0, sWidth = sw, sHeight = sh;
    if (srcRatio > targetRatio) {
      sWidth = sh * targetRatio;
      sx = (sw - sWidth) / 2;
    } else {
      sHeight = sw / targetRatio;
      sy = (sh - sHeight) / 2;
    }
    const scale = Math.min(1, 1440 / sHeight);
    const targetW = Math.round(sWidth * scale);
    const targetH = Math.round(sHeight * scale);
    canvas.width = targetW;
    canvas.height = targetH;

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.save();
    if (isMirrored) {
      ctx.translate(targetW, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(sourceEl, sx, sy, sWidth, sHeight, 0, 0, targetW, targetH);
    ctx.restore();

    applyFilterPixels(ctx, targetW, targetH, FILTERS[currentFilter].p);

    capturedDataUrl = compressForFirestore();
    hasCaptured = true;
    video.style.display = 'none';
    canvas.style.display = 'block';
    document.getElementById('liveControls').style.display = 'none';
    document.getElementById('filterBar').style.display = 'none';
    document.getElementById('postShotBox').style.display = 'block';
  }

  // Firestore membatasi dokumen ~1 MB: turunkan kualitas bertahap, lalu perkecil ukuran bila perlu
  function compressForFirestore() {
    const LIMIT = 900000;
    let q = 0.9;
    let out = canvas.toDataURL('image/jpeg', q);
    while (out.length > LIMIT && q > 0.55) {
      q -= 0.07;
      out = canvas.toDataURL('image/jpeg', q);
    }
    if (out.length > LIMIT) {
      const tmp = document.createElement('canvas');
      const f = Math.sqrt(LIMIT / out.length) * 0.95;
      tmp.width = Math.round(canvas.width * f);
      tmp.height = Math.round(canvas.height * f);
      const t = tmp.getContext('2d');
      t.imageSmoothingQuality = 'high';
      t.drawImage(canvas, 0, 0, tmp.width, tmp.height);
      out = tmp.toDataURL('image/jpeg', 0.8);
    }
    return out;
  }

  document.getElementById('shutterBtn').onclick = () => {
    if (!stream) { startCamera(); return; }
    triggerFlash();
    playShutterSound();
    renderFrame(video, facingMode === 'user');
  };

  function handleGalleryUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      document.getElementById('camPlaceholder').style.display = 'none';
      renderFrame(img, false);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  }
  document.getElementById('fileInput').onchange = handleGalleryUpload;
  document.getElementById('fileInput2').onchange = handleGalleryUpload;

  document.getElementById('retakeBtn').onclick = () => {
    hasCaptured = false;
    capturedDataUrl = '';
    canvas.style.display = 'none';
    video.style.display = 'block';
    document.getElementById('liveControls').style.display = 'flex';
    document.getElementById('filterBar').style.display = 'grid';
    document.getElementById('postShotBox').style.display = 'none';
    if (!stream) startCamera();
  };

  // Koneksi Firebase Firestore Real-Time
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  const photosRef = collection(db, 'artifacts', appId, 'public', 'data', `room_${roomCode}`);

  signInAnonymously(auth).catch(err => {
    document.getElementById('connText').textContent = 'Gagal koneksi auth: ' + err.code;
  });

  onAuthStateChanged(auth, (user) => {
    if (!user) return;
    currentUser = user;
    document.getElementById('connDot').classList.add('live');
    document.getElementById('connText').textContent = 'Terhubung ke Album Live';

    listenPhotos();
  });

  // Muat bertahap: awalnya 30 foto terbaru, tombol "Muat lebih banyak" menambah 30 lagi
  const PAGE_SIZE = 30;
  let visibleLimit = PAGE_SIZE;
  let unsubscribe = null;

  function listenPhotos() {
    if (unsubscribe) unsubscribe();
    const q = query(photosRef, orderBy('createdAtMs', 'desc'), limit(visibleLimit));
    unsubscribe = onSnapshot(q, (snap) => {
      const items = [];
      snap.forEach(d => items.push({ id: d.id, ...d.data() }));
      renderGallery(items, snap.size >= visibleLimit);
    }, (err) => {
      document.getElementById('connText').textContent = 'Cek Rules Firestore (' + err.code + ')';
    });
  }

  document.getElementById('loadMoreBtn').onclick = () => {
    const b = document.getElementById('loadMoreBtn');
    b.disabled = true;
    b.textContent = 'Memuat...';
    visibleLimit += PAGE_SIZE;
    listenPhotos();
  };

  document.getElementById('uploadBtn').onclick = async () => {
    if (!capturedDataUrl || !currentUser) return;
    const btn = document.getElementById('uploadBtn');
    const nameVal = document.getElementById('senderName').value.trim() || 'Tamu Undangan';
    const noteVal = document.getElementById('senderNote').value.trim();

    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    try {
      await addDoc(photosRef, {
        image: capturedDataUrl,
        name: nameVal,
        note: noteVal,
        filter: currentFilter,
        uid: currentUser.uid,
        createdAt: serverTimestamp(),
        createdAtMs: Date.now()
      });
      document.getElementById('senderNote').value = '';
      document.getElementById('retakeBtn').click();
      btn.disabled = false;
      btn.textContent = 'Simpan ke Album';
      switchTab('album');
    } catch (err) {
      alert('Gagal menyimpan foto: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Simpan ke Album';
    }
  };

  function esc(str) {
    return String(str || '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  }

  function renderGallery(items, hasMore) {
    document.getElementById('navCount').textContent = items.length + (hasMore ? '+' : '');
    const lm = document.getElementById('loadMoreBtn');
    lm.style.display = hasMore ? 'inline-flex' : 'none';
    lm.disabled = false;
    lm.textContent = 'Muat lebih banyak';
    document.getElementById('photoCountText').textContent = items.length
      ? `${items.length}${hasMore ? '+' : ''} momen terabadikan`
      : 'Belum ada foto. Jadilah tamu pertama yang mengabadikan momen!';

    const grid = document.getElementById('galleryGrid');
    grid.innerHTML = items.map(item => `
      <div class="polaroid">
        <img src="${item.image}" alt="Foto dari ${esc(item.name)}" loading="lazy">
        <div class="cap">${esc(item.name)}</div>
        ${item.note ? `<div class="msg">${esc(item.note)}</div>` : ''}
        <div class="act">
          <a class="mini-link" href="${item.image}" download="DhaniFitrah-${item.id.slice(0,5)}.jpg">Unduh</a>
          ${currentUser && item.uid === currentUser.uid
            ? `<button class="mini-link" style="color:#A64B4B" onclick="deletePhoto('${item.id}')">Hapus</button>`
            : ''}
        </div>
      </div>
    `).join('');
  }

  window.deletePhoto = async function(id) {
    if (!confirm('Hapus foto ini dari album?')) return;
    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `room_${roomCode}`, id));
  };
</script>
</body>
</html>
